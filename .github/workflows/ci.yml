name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Unit tests
        run: Scripts/test.sh

      # Builds the release binary, packages Couch.app and signs it ad-hoc (the
      # local signing identity only exists on the maintainer's Mac).
      - name: Build and package app
        run: Scripts/build-app.sh

      - name: Check the bundle
        run: |
          codesign --verify --strict dist/Couch.app
          test -f dist/Couch.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Couch.app/Contents/Info.plist
